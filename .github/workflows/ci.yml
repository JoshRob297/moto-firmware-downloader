name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [18.x, 20.x, 22.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Syntax verification and CLI check
      run: |
        node --check mfd-cli.mjs
        node --test
        node mfd-cli.mjs --help

    - name: Version consistency
      shell: bash
      run: |
        PKG_VERSION=$(node -p "require('./package.json').version")
        CLI_VERSION=$(node -p "require('node:fs').readFileSync('./mfd-cli.mjs','utf8').match(/const VERSION = \"([^\"]+)\"/)[1]")
        echo "package.json: $PKG_VERSION | mfd-cli.mjs: $CLI_VERSION"
        test "$PKG_VERSION" = "$CLI_VERSION"

    - name: Installer syntax check
      if: runner.os != 'Windows'
      shell: bash
      run: bash -n install.sh
